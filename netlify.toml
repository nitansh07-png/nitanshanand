# Deploy config for nitanshanand.com
#
# Static site, no build step: the repo root is the site root. Netlify serves
# 404.html automatically for unmatched paths, so no catch-all redirect here.

[build]
  publish = "."

# The canonical tags all point at the apex. Without this, www serves the same
# pages under a second hostname and the two compete in the index.
[[redirects]]
  from = "https://www.nitanshanand.com/*"
  to = "https://nitanshanand.com/:splat"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# Caching
#
# Filenames here are NOT content-hashed: styles.css stays styles.css when it
# changes. So HTML, CSS and JS must revalidate every time or an edit you push
# will not reach anyone who has already visited.
# ---------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Images, video and the PDF change rarely. A week is safe, but note the same
# no-hash caveat: if you REPLACE one, give it a new filename, or returning
# visitors keep the old bytes until the week is up.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
